services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: daryeelpass
      POSTGRES_PASSWORD: daryeelpass
      POSTGRES_DB: daryeelpass
    ports:
      - "5433:5432"
    volumes:
      - daryeelpass-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U daryeelpass -d daryeelpass"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  daryeelpass-postgres:
